[project]
name = "rentcover-agent"
version = "0.1.0"
description = "RentCover: an AI agent that checks whether a rental property's rent will cover the loan. FastAPI + LiteLLM + Gemini on Cloud Run."
requires-python = ">=3.10"
dependencies = [
    "fastapi>=0.109.0",
    "uvicorn>=0.27.0",
    "litellm>=1.50",
    "google-cloud-aiplatform>=1.40.0",
    "requests>=2.31",
]
